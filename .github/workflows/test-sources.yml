name: Test no-key OHLC sources

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install pandas requests lxml html5lib beautifulsoup4

      - name: Test FinancialContent and Odin500
        run: |
          python - <<'PY'
          import io
          import pandas as pd
          import requests

          session = requests.Session()

          session.headers.update({
              "User-Agent":
                  "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) "
                  "AppleWebKit/605.1.15 (KHTML, like Gecko) "
                  "Version/18.0 Mobile/15E148 Safari/604.1"
          })


          def fetch(url):

              r = session.get(
                  url,
                  timeout=(15, 45)
              )

              print(
                  "HTTP",
                  r.status_code,
                  url
              )

              r.raise_for_status()

              print(
                  "bytes:",
                  len(r.content)
              )

              return r.text


          def normalize_table(df):

              df = df.copy()

              df.columns = [
                  str(c).strip().lower()
                  for c in df.columns
              ]

              needed = [
                  "date",
                  "open",
                  "high",
                  "low",
                  "close"
              ]

              if not all(
                  c in df.columns
                  for c in needed
              ):
                  return None


              out = df[
                  needed
              ].copy()


              out["date"] = pd.to_datetime(
                  out["date"],
                  errors="coerce"
              )


              for c in [
                  "open",
                  "high",
                  "low",
                  "close"
              ]:

                  out[c] = pd.to_numeric(
                      out[c]
                      .astype(str)
                      .str.replace(
                          ",",
                          "",
                          regex=False
                      ),
                      errors="coerce"
                  )


              out = out.dropna()

              out = out.sort_values(
                  "date"
              )

              return out


          def find_ohlc_table(
              html,
              name
          ):

              tables = pd.read_html(
                  io.StringIO(html)
              )

              print(
                  name,
                  "table count:",
                  len(tables)
              )


              candidates = []


              for i, table in enumerate(
                  tables
              ):

                  norm = normalize_table(
                      table
                  )

                  if (
                      norm is not None
                      and not norm.empty
                  ):

                      print(
                          name,
                          "candidate table",
                          i,
                          "rows:",
                          len(norm),
                          "range:",
                          norm.iloc[0]["date"].date(),
                          "->",
                          norm.iloc[-1]["date"].date()
                      )

                      candidates.append(
                          norm
                      )


              if not candidates:

                  raise RuntimeError(
                      name
                      + ": no OHLC table found"
                  )


              best = max(
                  candidates,
                  key=len
              )


              print(
                  "\n"
                  + name
                  + " LATEST ROWS"
              )


              print(
                  best
                  .tail(5)
                  .to_string(
                      index=False
                  )
              )


              return best


          # NASDAQ Composite
          nasdaq_url = (
              "https://markets.financialcontent.com/"
              "stocks/quote/historical"
              "?Symbol=NQ%3ACOMP"
          )


          nasdaq_html = fetch(
              nasdaq_url
          )


          nasdaq = find_ohlc_table(
              nasdaq_html,
              "NASDAQ FinancialContent"
          )


          # S&P 500
          spx_url = (
              "https://www.odin500.com/"
              "historical-data/spx"
          )


          spx_html = fetch(
              spx_url
          )


          spx = find_ohlc_table(
              spx_html,
              "SPX Odin500"
          )


          print(
              "\n=== TEST RESULT ==="
          )


          print(
              "NASDAQ latest:",
              nasdaq.iloc[-1].to_dict()
          )


          print(
              "SPX latest:",
              spx.iloc[-1].to_dict()
          )

          PY
